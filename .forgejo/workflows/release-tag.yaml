# Weekly: run scripts/create-tag.mjs patch (same script as a manual `pnpm release`):
# lint + typecheck, bump package.json, commit, tag X.Y.Z, push branch and tag.
# The docker-publish workflow then catches the tag push, builds/deploys and
# creates the Forgejo release.
#
# The push MUST use a personal token (secret RELEASE_PAT, write access to this
# repo, ideally the ci-bot user's): pushes made with the automatic workflow token
# don't trigger other workflows, so docker-publish would never fire.
name: release-tag
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Bump and push tag
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"

          # Nothing new since the last release: skip.
          EXISTING=$(git tag --points-at HEAD | grep -E '^[0-9]' | head -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "HEAD already at ${EXISTING}, skipping new tag"
            exit 0
          fi

          # Release commit + tag authored by ci-bot; pushed with RELEASE_PAT (persisted by
          # actions/checkout).
          git config --global user.name  "ci-bot"
          git config --global user.email "mathieuhoyer+ci-bot@gmail.com"

          # Same script as a manual `pnpm release`: lint + typecheck, bump
          # package.json, commit, tag, push branch and tag.
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/create-tag.mjs patch
