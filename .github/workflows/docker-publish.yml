name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (tag or branch)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Load secrets from Proton Pass
        uses: gizmodlabs/load-secrets-proton-pass@e3cc6f29771ca384c33380a0e62c5f7aca60cef1 # v1.0.0
        with:
          personal-access-token: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        env:
          GH_PAT: pass://Coding-prod/Github/GH_PUBLIC_REPO_PAT
          NEXT_PUBLIC_SITE_URL: pass://Coding-prod/Portfolio/NEXT_PUBLIC_SITE_URL
          EMAIL: pass://Coding-prod/Portfolio/EMAIL

      - name: Set app version
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          echo "APP_VERSION=${ref#v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          secrets: |
            github_token=${{ env.GH_PAT }}
            email=${{ env.EMAIL }}

  update-personal-ops:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Load secrets from Proton Pass
        uses: gizmodlabs/load-secrets-proton-pass@e3cc6f29771ca384c33380a0e62c5f7aca60cef1 # v1.0.0
        with:
          personal-access-token: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        env:
          GH_PRIVATE_PAT: pass://Coding-prod/Github/GH_PERSONAL_OPS_PAT

      - name: Render and push compose to personal-ops
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          export REGISTRY_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_TAG="${RELEASE_REF#v}"
          git clone --depth 1 "https://x-access-token:${GH_PRIVATE_PAT}@github.com/MatHoyer/personal-ops.git"
          cd personal-ops
          envsubst '${REGISTRY_IMAGE_PREFIX} ${IMAGE_TAG}' \
            < portfolio/docker-compose.tpl.yml > portfolio/docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/docker-compose.yml
          if git diff --staged --quiet; then
            echo "No compose changes for tag ${RELEASE_REF}"
            exit 0
          fi
          git commit -m "chore(portfolio): bump image to ${RELEASE_REF}"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: update-personal-ops
    environment: dokploy
    steps:
      - name: Load secrets from Proton Pass
        uses: gizmodlabs/load-secrets-proton-pass@e3cc6f29771ca384c33380a0e62c5f7aca60cef1 # v1.0.0
        with:
          personal-access-token: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
        env:
          DEPLOY_API_URL: pass://Coding-prod/Dokploy/DEPLOY_API_URL
          DEPLOY_APPLICATION_ID: pass://Coding-prod/Dokploy/PORTFOLIO_APPLICATION_ID
          DEPLOY_TOKEN: pass://Coding-prod/Dokploy/DEPLOY_TOKEN

      - name: Trigger Dokploy deploy
        env:
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || sudo apt-get update && sudo apt-get install -y jq
          if [ -z "${DEPLOY_API_URL:-}" ]; then
            echo "DEPLOY_API_URL is not set" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_APPLICATION_ID:-}" ]; then
            echo "DEPLOY_APPLICATION_ID is not set" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN is not set" >&2
            exit 1
          fi
          payload="$(jq -nc --arg id "$DEPLOY_APPLICATION_ID" '{composeId: $id}')"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          code=$(curl -sS -o "$out" -w "%{http_code}" -X POST "$DEPLOY_API_URL" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DEPLOY_TOKEN}" \
            -d "$payload")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Deploy API HTTP $code — body:" >&2
            cat "$out" >&2
            exit 1
          fi
          echo "Deploy OK ($code) — tag ${RELEASE_TAG}"
