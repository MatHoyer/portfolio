name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (tag or branch)
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GH_PAT }}
