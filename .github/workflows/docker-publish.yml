name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (tag or branch)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.ref == '' && github.ref_type == 'tag' }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GH_PAT }}
            EMAIL=${{ vars.EMAIL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    container: alpine:3.23
    environment: dokploy
    steps:
      - name: Trigger Dokploy deploy
        env:
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          DEPLOY_APPLICATION_ID: ${{ secrets.DEPLOY_APPLICATION_ID }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          apk add --no-cache curl jq
          if [ -z "${DEPLOY_API_URL:-}" ]; then
            echo "DEPLOY_API_URL secret is not set" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_APPLICATION_ID:-}" ]; then
            echo "DEPLOY_APPLICATION_ID secret is not set" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret is not set" >&2
            exit 1
          fi
          payload="$(jq -nc --arg id "$DEPLOY_APPLICATION_ID" '{composeId: $id}')"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          code=$(curl -sS -o "$out" -w "%{http_code}" -X POST "$DEPLOY_API_URL" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DEPLOY_TOKEN}" \
            -d "$payload")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Deploy API HTTP $code — body:" >&2
            cat "$out" >&2
            exit 1
          fi
          echo "Deploy OK ($code) — tag ${RELEASE_TAG}"
