name: Weekly release tag

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump and push tag
        id: tag
        run: |
          set -euo pipefail

          EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "tag=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "HEAD already at ${EXISTING}, skipping new tag"
            exit 0
          fi

          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$LATEST" ]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          else
            VERSION="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Weekly release ${TAG}"
          git push origin "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  create-release:
    needs: bump-and-tag
    if: needs.bump-and-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.bump-and-tag.outputs.tag }}" \
            --title "${{ needs.bump-and-tag.outputs.tag }}" \
            --generate-notes

  publish:
    needs: bump-and-tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
    with:
      ref: ${{ needs.bump-and-tag.outputs.tag }}
